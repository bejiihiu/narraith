name: Bug report
description: Something in the skill structure, links, or scripts is broken
title: "[bug] "
labels: bug
body:
  - type: textarea
    id: what
    attributes:
      label: What is broken
      description: File, line if you have it, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Command, prompt, or link check. If it is a link, name both sides.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
